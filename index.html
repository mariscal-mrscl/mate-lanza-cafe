<style>
@font-face{font-family:"JetBrains Mono";font-weight:100 800;font-display:swap;src:url(vendor/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2")}
:root{--bg:#050505;--line:#2a2a2a;--fg:#f2f2f2;--mute:#7a7a7a;--ok:#8fd19e;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--mono)}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(40px,8vh,72px);padding:48px 20px}
.logo{display:flex;align-items:center;gap:16px}
.logo svg{width:min(300px,62vw);height:auto;display:block}
.logo span{font-weight:500;font-size:14px;letter-spacing:.42em;color:var(--mute);padding-left:14px;border-left:1px solid var(--line)}
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(560px,100%)}
nav a{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;height:clamp(170px,28vh,240px);padding:16px 18px;

  transition:border-color .2s}
nav a canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;transition:opacity .25s}
nav a::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.85));pointer-events:none}
nav a span{position:relative;z-index:1}
nav a b{position:relative;z-index:1;font-weight:400;letter-spacing:0;opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .2s}
nav a:hover,nav a:focus-visible{border-color:var(--fg);outline:none}
nav a:hover canvas,nav a:focus-visible canvas{opacity:1}
nav a:hover b,nav a:focus-visible b{opacity:1;transform:none}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:56px}
button{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;background:none;color:var(--fg);border:1px solid var(--fg);border-radius:4px;padding:11px 22px;cursor:pointer;transition:background .15s,color .15s}
button:hover,button:focus-visible{background:var(--fg);color:#000;outline:none}button[hidden]{display:none}
.estado{font-size:11px;letter-spacing:.06em;color:var(--mute);display:inline-flex;align-items:center;gap:8px;text-align:center}
.estado i{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}.estado.ok{color:var(--ok)}.estado.ok i{background:var(--ok)}
@media (max-width:420px){nav{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){nav a,nav a canvas,nav a b,button{transition:none}}

  <div class="app">
    <button id="instalar" hidden>Instalar app</button>
    <span class="estado" id="estado" role="status"><i></i><span></span></span>
  </div>
</main>
<script>
const $ = id => document.getElementById(id), est = $("estado");
const ponerEstado = (t, cls) => { est.className = "estado" + (cls ? " " + cls : ""); est.lastElementChild.textContent = t; };
const instalada = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let aviso = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); aviso = e; $("instalar").hidden = false; });
$("instalar").onclick = async () => { if (!aviso) return; aviso.prompt(); const r = await aviso.userChoice; aviso = null; $("instalar").hidden = true; if (r.outcome === "accepted") ponerEstado("Instalada", "ok"); };
addEventListener("appinstalled", () => { $("instalar").hidden = true; ponerEstado("Instalada", "ok"); });
async function revisar(){
  if (!/^https?:$/.test(location.protocol) || !("serviceWorker" in navigator)) return;
  const reg = await navigator.serviceWorker.ready, sw = reg.active; if (!sw) return;
  navigator.serviceWorker.addEventListener("message", e => { const {guardados, total} = e.data || {}; if (guardados == null) return;
    if (guardados >= total) ponerEstado(instalada() ? "Instalada · funciona sin internet" : "Funciona sin internet", "ok");
    else { ponerEstado(`Preparando ${guardados}/${total}`); setTimeout(() => sw.postMessage("estado"), 1500); } });
  sw.postMessage("estado");
  if (ios && !instalada()) setTimeout(() => { if (!est.classList.contains("ok")) return; ponerEstado("Safari → Compartir → Agregar a inicio", "ok"); }, 3000); }
revisar();

// animaciones de los botones: TD = líneas Rutt-Etra desplazadas por una onda; ASCII = un campo de caracteres que late. Con el mouse encima se aceleran y siguen al puntero.
const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
const RAMPA = " .:-=+*#%@";
document.querySelectorAll("nav a").forEach(a => {
  const cv = a.querySelector("canvas"), x = cv.getContext("2d"), fx = cv.dataset.fx;
  let W = 0, H = 0, dpr = 1, t = Math.random()*10, vel = 1, velObj = 1, mx = .5, my = .5, mxo = .5, myo = .5;
  const medir = () => { dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); x.setTransform(dpr, 0, 0, dpr, 0, 0); };
  new ResizeObserver(() => { medir(); if (quieto) dibujar(); }).observe(cv);
  a.addEventListener("pointerenter", () => { velObj = 2.6; });
  a.addEventListener("pointerleave", () => { velObj = 1; mxo = .5; myo = .5; });
  a.addEventListener("pointermove", e => { const r = a.getBoundingClientRect(); mxo = (e.clientX - r.left)/r.width; myo = (e.clientY - r.top)/r.height; });
  function td(){   // líneas horizontales; cada una se levanta donde hay "luz" (una mancha que se mueve) y ondula
    x.clearRect(0, 0, W, H); const n = 26, cx = mx*W, cy = my*H;
    for (let i=0; i<n; i++){ const y0 = H*(.12 + .8*i/(n - 1)), k = i/(n - 1);
      x.beginPath(); for (let px=0; px<=W; px+=4){ const d = Math.hypot(px - cx, (y0 - cy)*1.4)/Math.max(W, H), luz = Math.exp(-d*d*9);
        const y = y0 - luz*H*.22*vel**.35 - Math.sin(px*.035 + t*2 + i*.45)*3*(.4 + luz) - Math.sin(px*.011 - t*.7)*4;
        px ? x.lineTo(px, y) : x.moveTo(px, y); }
      x.strokeStyle = `rgba(255,255,255,${.18 + .55*k})`; x.lineWidth = .6 + k*.7; x.stroke(); } }
  function ascii(){   // grilla de caracteres: el brillo es una onda que sale del centro (o del puntero)
    x.clearRect(0, 0, W, H); const fs = 11, cw = fs*.62, ch = fs*1.15, cols = Math.ceil(W/cw), rows = Math.ceil(H/ch), cx = mx*cols, cy = my*rows;
    x.font = `500 ${fs}px "JetBrains Mono", monospace`; x.textBaseline = "top";
    for (let r=0; r<rows; r++) for (let c=0; c<cols; c++){ const d = Math.hypot(c - cx, (r - cy)*1.9);
      const b = Math.max(0, Math.min(1, .5 + .5*Math.sin(d*.42 - t*2.4) * Math.exp(-d*.035) + .12*Math.sin(c*.3 + r*.5 + t)));
      const q = Math.floor(b*(RAMPA.length - 1)); if (!q) continue;
      x.fillStyle = `rgba(255,255,255,${.25 + .75*b})`; x.fillText(RAMPA[q], c*cw, r*ch); } }
  const dibujar = () => (fx === "td" ? td : ascii)();
  let ult = 0;
  function cuadro(ts){ const dt = Math.min(.05, (ts - (ult || ts))/1000); ult = ts;
    vel += (velObj - vel)*.08; mx += (mxo - mx)*.08; my += (myo - my)*.08; t += dt*vel; dibujar(); requestAnimationFrame(cuadro); }
  medir(); if (quieto) dibujar(); else requestAnimationFrame(cuadro); });
</script>
